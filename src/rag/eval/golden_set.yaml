# Golden question set for the sample corpus.
#
# Four categories, as the plan requires:
#   lookup    - the answer sits in one place and is stated plainly
#   multihop  - needs two or more facts, often across documents
#   no_answer - plausible question the corpus genuinely cannot answer;
#               the correct behaviour is to decline, not to guess
#   ambiguous - underspecified; a good answer names the ambiguity
#
# expected_sources drives retrieval scoring. It lists the file(s) that
# actually contain the answer, so retrieval can be measured independently
# of whether the model wrote a good sentence.

- id: q001
  category: lookup
  question: What environment variable holds the deploy token?
  expected_answer: DEPLOY_TOKEN.
  expected_sources: [deploy-guide.md]
  answerable: true

- id: q002
  category: lookup
  question: How often does the deploy token rotate?
  expected_answer: Every ninety days.
  expected_sources: [deploy-guide.md]
  answerable: true

- id: q003
  category: lookup
  question: What error code appears when the deploy token has expired?
  expected_answer: ERR_AUTH_4011.
  expected_sources: [deploy-guide.md]
  answerable: true

