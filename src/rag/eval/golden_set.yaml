  category: lookup
  question: How long until an unacknowledged page escalates?
  expected_answer: Ten minutes to the on-call manager, then ten more to the engineering director.
  expected_sources: [oncall-quickref.md]
  answerable: true

- id: q037
  category: multihop
  question: If a bad deploy ran a database migration, what does rolling back actually fix?
  expected_answer: Only the running code. Rollbacks do not revert migrations, feature flags or durable storage, so the older code may read a schema it does not understand.
  expected_sources: [deploy-guide.md]
  answerable: true

- id: q038
  category: multihop
  question: A deploy went out twenty minutes ago and latency is climbing. What should happen first?
  expected_answer: Declare the incident, then check the deployment ledger and roll back before debugging, since most incidents follow a recent deploy.
  expected_sources: [incident-runbook.md, deploy-guide.md]
  answerable: true

- id: q039
  category: multihop
  question: Why can rolling back beyond ninety days fail?
  expected_answer: The ledger only keeps ninety days, and older images may have been pruned from the registry, so the digest no longer exists and a rebuild from tag is needed.
  expected_sources: [deploy-guide.md]
  answerable: true

- id: q040
  category: multihop
  question: How can autoscaling cause a database incident?
  expected_answer: Total connections are pool size times instance count, so scaling the application tier past the database connection limit exhausts it and produces ERR_DB_5031.
  expected_sources: [incident-runbook.md]
  answerable: true

- id: q041
  category: multihop
  question: Why can a deletion request not fully remove a record immediately?
  expected_answer: Backups are immutable snapshots, so the record is suppressed on restore and ages out with the thirty-five day backup window.
  expected_sources: [data-retention-policy.pdf]
  answerable: true

- id: q042
  category: multihop
  question: A new engineer wants production access on day one to debug. Is that possible?
  expected_answer: No. Production access requires completing training and joining an on-call rotation, and is not granted on day one.
  expected_sources: [onboarding.html]
  answerable: true

- id: q043
  category: multihop
  question: What changed about connection pool defaults and where is it recorded?
  expected_answer: DATABASE_POOL_SIZE was raised from 10 to 20 on 2026-08-14, recorded in the changelog.
  expected_sources: [changelog.txt, incident-runbook.md]
  answerable: true

